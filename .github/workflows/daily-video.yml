
name: Dino 3D episode

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *"

permissions:
  contents: read

concurrency:
  group: dino-daily-video
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

     
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            blender ffmpeg fonts-dejavu-core libegl1 libgl1 libgles2

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-lessac-medium-v1

      - name: Download Piper voice model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voices
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium"
          MODEL="voices/en_US-lessac-medium.onnx"
          CONFIG="${MODEL}.json"

          if [ ! -s "$MODEL" ]; then
            curl -fL --retry 3 --connect-timeout 20 "$BASE/en_US-lessac-medium.onnx" -o "$MODEL"
          fi

          if [ ! -s "$CONFIG" ]; then
            curl -fL --retry 3 --connect-timeout 20 "$BASE/en_US-lessac-medium.onnx.json" -o "$CONFIG"
          fi

          test -s "$MODEL"
          test -s "$CONFIG"
          echo "PIPER_VOICE=$GITHUB_WORKSPACE/$MODEL" >> "$GITHUB_ENV"
          echo "PIPER_CONFIG=$GITHUB_WORKSPACE/$CONFIG" >> "$GITHUB_ENV"

      - name: Verify tools
        run: |
          blender --version | head -n 2
          ffmpeg -version | head -n 1
          command -v piper
          test -s "$PIPER_VOICE"
          test -s "$PIPER_CONFIG"

      - name: Generate animated episode
        run: python make_video.py

      - name: Save video for preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dino-video-output
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload to YouTube privately
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY: private
        run: python upload_youtube.py
